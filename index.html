<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Payday Planner</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Payday">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#3444C4">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky header with three tabs, then one column of ledger-style paycheck cards, capped at 760px. */
:root{
  --bg:#F2F5F9; --surface:#FFFFFF; --surface2:#E8EDF4; --ink:#152033; --ink2:#586579; --line:#D5DCE7;
  --accent:#3444C4; --accent-ink:#FFFFFF; --accent-soft:#E3E7FA;
  --good:#1D7A4B; --good-soft:#DDF1E6; --warn:#8F5A00; --warn-soft:#FBEED2; --bad:#B3261E; --bad-soft:#FBE2DF;
  --font-display:'Bricolage Grotesque','IBM Plex Sans',system-ui,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141D; --surface:#161E2A; --surface2:#1F2937; --ink:#E6ECF4; --ink2:#9BA8BB; --line:#2A3546;
  --accent:#8E9AF6; --accent-ink:#0E141D; --accent-soft:#232B54;
  --good:#5FCB93; --good-soft:#143328; --warn:#E8B34F; --warn-soft:#3A2D12; --bad:#FF8E85; --bad-soft:#40201D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141D; --surface:#161E2A; --surface2:#1F2937; --ink:#E6ECF4; --ink2:#9BA8BB; --line:#2A3546;
  --accent:#8E9AF6; --accent-ink:#0E141D; --accent-soft:#232B54;
  --good:#5FCB93; --good-soft:#143328; --warn:#E8B34F; --warn-soft:#3A2D12; --bad:#FF8E85; --bad-soft:#40201D; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:22px;line-height:1.1}
h2{font-size:18px}
h3{font-size:15px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.topin{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-top:12px}
.topin p{color:var(--ink2);font-size:13px}
.tabs{display:flex;gap:4px;margin-top:6px}
.tab{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:10px 4px;font-weight:600;color:var(--ink2);font-size:14px;letter-spacing:.01em}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

main{display:flex;flex-direction:column;gap:16px;padding-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.hero{display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.bigdate{font-family:var(--font-display);font-size:30px;font-weight:700;line-height:1.05;letter-spacing:-.02em}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat b{display:block;font-size:17px;font-weight:600}
.stat span{font-size:12px;color:var(--ink2)}
.muted{color:var(--ink2)}
.small{font-size:13px}
.xs{font-size:12px}

.alert{border-color:var(--bad);background:var(--bad-soft);display:flex;flex-direction:column;gap:6px}
.alert h2{color:var(--bad);font-size:16px}
.info{background:var(--warn-soft);border-color:transparent;color:var(--ink)}

.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

details.pc{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
details.pc>summary{list-style:none;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:10px}
details.pc>summary::-webkit-details-marker{display:none}
.pc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pc-date{font-family:var(--font-display);font-weight:700;font-size:18px;letter-spacing:-.01em}
.pc-tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.meter{height:6px;border-radius:9px;background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--good);border-radius:9px}
.chev{width:10px;height:10px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(45deg);transition:transform .15s;margin:5px 4px 0 0}
details[open]>summary .chev{transform:rotate(-135deg);margin-top:9px}
.flow{border-top:1px solid var(--line);padding:12px 16px;display:grid;gap:4px;font-size:14px;background:var(--surface2)}
.flow div{display:flex;justify-content:space-between;gap:12px}
.flow .tot{border-top:1px dashed var(--line);margin-top:4px;padding-top:6px;font-weight:600}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer}
.row input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--good)}
.row .nm{font-weight:500;overflow-wrap:anywhere}
.row .sb{font-size:13px;color:var(--ink2);overflow-wrap:anywhere}
.row .am{font-weight:600;white-space:nowrap}
.row.done .nm,.row.done .am{text-decoration:line-through;color:var(--ink2)}
.row.done .sb{opacity:.7}
.row.extra{background:var(--accent-soft)}
.row.extra .nm{color:var(--accent)}
.tagline{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:6px 2px 0}
.dayhead h3{font-size:16px}

label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2);min-width:0}
input[type=number],input[type=text],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 10px;color:var(--ink);width:100%;min-width:0;font-size:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hint{font-size:12px;color:var(--ink2)}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}

table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;text-align:left;color:var(--ink2);font-weight:600;padding:6px 8px 6px 0}
td{padding:9px 8px 9px 0;border-top:1px solid var(--line);vertical-align:top}
th:last-child,td:last-child{text-align:right;padding-right:0}
tr.cur td{font-weight:600}
.scroll{overflow-x:auto}

.dbt{display:flex;flex-direction:column;gap:12px}
.dbt-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.ord{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13px;flex:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-top:6px}
.legend i{display:inline-block;width:16px;height:0;border-top:3px solid;vertical-align:middle;margin-right:6px}
svg.ch{width:100%;height:auto;display:block}
svg.ch text{fill:var(--ink2);font-size:11px;font-family:var(--font-body)}
svg.ch .g{stroke:var(--line);stroke-width:1}
svg.ch polyline{fill:none;stroke-linejoin:round;stroke-linecap:round}
.l-min{stroke:var(--ink2);stroke-width:2;stroke-dasharray:5 4}
.l-plan{stroke:var(--accent);stroke-width:2.5}
.l-bonus{stroke:var(--good);stroke-width:2.5}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.bad{color:var(--bad)}
.scrim{position:fixed;inset:0;background:rgba(8,12,20,.55);z-index:20}
.sheet{position:fixed;z-index:21;left:50%;top:max(16px,env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(520px,calc(100% - 24px));max-height:calc(100% - 32px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px)}
.skel{height:120px;border-radius:14px;background:linear-gradient(90deg,var(--surface2),var(--surface),var(--surface2));background-size:200% 100%;animation:sh 1.4s infinite linear}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}.chev{transition:none}}
@media (max-width:420px){.bigdate{font-size:26px}.stats{gap:8px}.stat b{font-size:15px}}

html,body{margin:0}
[hidden]{display:none!important}
button{font-family:inherit;color:inherit;cursor:pointer}
.tab{font-size:12.5px;padding-inline:2px}
.data-sec{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.data-sec p{margin:0}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
code{background:var(--surface2);padding:1px 5px;border-radius:5px;font-size:13px;word-break:break-all}
textarea.paste{width:100%;min-height:90px;font-size:13px;font-family:ui-monospace,monospace;background:var(--surface);border:1px solid var(--line);border-radius:9px;color:var(--ink);padding:9px}
.al{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}.al small{display:block;color:var(--ink2);font-size:12px;font-weight:400}.al.tot{border-bottom:0;font-weight:700}.data-sec .f{display:flex;flex-direction:column;gap:4px;font-size:13px}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="topin"><h1>Payday Planner</h1><p id="sub"></p></div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" data-tab="pay" id="t-pay">Pay</button>
      <button class="tab" role="tab" data-tab="check" id="t-check">Paycheck</button>
      <button class="tab" role="tab" data-tab="debts" id="t-debts">Debts</button>
      <button class="tab" role="tab" data-tab="bills" id="t-bills">Bills</button>
      <button class="tab" role="tab" data-tab="data" id="t-data">Data</button>
    </nav>
  </header>
  <main id="app"><div class="skel"></div><div class="skel"></div></main>
</div>
<div id="layer"></div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
'use strict';
// ==LOGIC-START==
var MS=86400000;
function pad(n){return String(n).padStart(2,'0');}
function iso(d){return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());}
function parse(s){var p=s.split('-').map(Number);return new Date(Date.UTC(p[0],p[1]-1,p[2]));}
function addDays(s,n){return iso(new Date(parse(s).getTime()+n*MS));}
function dow(s){return parse(s).getUTCDay();}
function daysBetween(a,b){return Math.round((parse(b)-parse(a))/MS);}
function nthWeekday(y,m,wd,n){
  if(n>0){var first=new Date(Date.UTC(y,m-1,1));var off=(wd-first.getUTCDay()+7)%7;return iso(new Date(Date.UTC(y,m-1,1+off+(n-1)*7)));}
  var last=new Date(Date.UTC(y,m,0));var o2=(last.getUTCDay()-wd+7)%7;return iso(new Date(Date.UTC(y,m-1,last.getUTCDate()-o2)));
}
function observed(y,m,d){var s=iso(new Date(Date.UTC(y,m-1,d)));var w=dow(s);if(w===6)return addDays(s,-1);if(w===0)return addDays(s,1);return s;}
var HOL=new Set();
for(var Y=2025;Y<=2042;Y++){
  [observed(Y,1,1),nthWeekday(Y,1,1,3),nthWeekday(Y,2,1,3),nthWeekday(Y,5,1,-1),observed(Y,6,19),observed(Y,7,4),
   nthWeekday(Y,9,1,1),nthWeekday(Y,10,1,2),observed(Y,11,11),nthWeekday(Y,11,4,4),observed(Y,12,25)].forEach(function(h){HOL.add(h);});
}
function isBiz(s){var w=dow(s);return w!==0&&w!==6&&!HOL.has(s);}
function prevBiz(s){while(!isBiz(s))s=addDays(s,-1);return s;}
function genPaydays(from,months){
  var out=new Set();var y=+from.slice(0,4),m=+from.slice(5,7);
  for(var k=0;k<=months+1;k++){
    [1,15].forEach(function(d){var p=prevBiz(y+'-'+pad(m)+'-'+pad(d));if(p>=from)out.add(p);});
    m++;if(m>12){m=1;y++;}
  }
  return Array.from(out).sort();
}
function debtBills(debts,asOf){
  return debts.map(function(d){
    var y=+asOf.slice(0,4),m=+asOf.slice(5,7);
    var last=new Date(Date.UTC(y,m,0)).getUTCDate();
    var cand=y+'-'+pad(m)+'-'+pad(Math.min(d.dueDay,last));
    if(cand<asOf){m++;if(m>12){m=1;y++;}}
    return {id:'debt-'+d.id,name:d.name,group:'Debt',amount:d.min,freq:'monthly',dueDay:d.dueDay,start:y+'-'+pad(m),autopay:!!d.autopay,debtId:d.id,active:true,note:d.note||''};
  });
}
function instancesFor(bills,asOf,months,paid){
  var out=[];var endISO=addDays(asOf,months*31);
  function push(b,due){
    var key=b.id+'@'+due;var isPaid=!!paid[key];
    if(due>=asOf||(!isPaid&&due>=addDays(asOf,-30))){
      out.push({key:key,billId:b.id,name:b.name,group:b.group,amount:b.amount,due:due,autopay:!!b.autopay,debtId:b.debtId||null,note:b.note||'',kind:b.debtId?'debt':'bill'});
    }
  }
  bills.forEach(function(b){
    if(b.active===false)return;
    if(b.freq==='once'){if(b.dueDate)push(b,b.dueDate);return;}
    if(!b.start||!b.dueDay)return;
    var y=+b.start.slice(0,4),m=+b.start.slice(5,7);
    for(var n=0;n<1500;n++){
      var ld=new Date(Date.UTC(y,m,0)).getUTCDate();
      var due=y+'-'+pad(m)+'-'+pad(Math.min(b.dueDay,ld));
      if(due>endISO)break;
      push(b,due);m++;if(m>12){m=1;y++;}
    }
  });
  return out;
}
function r2(x){return Math.round(x*100)/100;}
function effApr(d,date){return (d.promoEnd&&date<d.promoEnd)?d.apr:(d.aprAfter!=null?d.aprAfter:d.apr);}
function simulate(cfg){
  var paid=cfg.paid||{};var paydays=genPaydays(cfg.asOf,cfg.months);
  var all=cfg.bills.concat(debtBills(cfg.debts,cfg.asOf));
  var inst=instancesFor(all,cfg.asOf,cfg.months,paid);
  inst.forEach(function(i){
    var base=i.autopay?i.due:addDays(i.due,-cfg.buffer);
    i.payBy=i.due<cfg.asOf?paydays[0]:prevBiz(base);
    var f=0;for(var k=0;k<paydays.length;k++){if(paydays[k]<=i.payBy)f=k;else break;}
    i.fund=f;
  });
  var by=paydays.map(function(){return [];});
  inst.forEach(function(i){by[i.fund].push(i);});
  by.forEach(function(a){a.sort(function(x,y){return x.payBy<y.payBy?-1:x.payBy>y.payBy?1:(x.due<y.due?-1:x.due>y.due?1:0);});});
  var D={};cfg.debts.forEach(function(d){D[d.id]={id:d.id,name:d.name,bal:d.balance,apr:d.apr,min:d.min,promo:d.promoEnd||null,aprAfter:(d.aprAfter!=null?d.aprAfter:d.apr)};});
  var ids=Object.keys(D);var rows=[];var paidOff={};var interest=0;
  function total(){return ids.reduce(function(s,k){return s+Math.max(0,D[k].bal);},0);}
  var series=[{date:cfg.asOf,total:total()}];
  for(var i=0;i<paydays.length;i++){
    if(i>0)ids.forEach(function(k){var d=D[k];if(d.bal>0.005){var x=r2(d.bal*(d.promo&&paydays[i]<d.promo?d.apr:d.aprAfter)/2400);d.bal=r2(d.bal+x);interest+=x;}});
    var items=[];var billsTotal=0;
    by[i].forEach(function(it){
      if(it.debtId){var d=D[it.debtId];if(!d||d.bal<=0.005)return;var amt=r2(Math.min(d.min,d.bal));d.bal=r2(d.bal-amt);items.push(Object.assign({},it,{amount:amt}));billsTotal+=amt;}
      else{items.push(it);billsTotal+=it.amount;}
    });
    billsTotal=r2(billsTotal);var dt=paydays[i];
    var inc=(cfg.netBy&&cfg.netBy[dt]!=null)?cfg.netBy[dt]:cfg.takeHome;
    var liv=(cfg.livBy&&cfg.livBy[dt]!=null)?cfg.livBy[dt]:r2(cfg.living/2);
    var avail=r2(inc-billsTotal-liv);var lump=0;
    if(i===0&&cfg.bonus>0){avail=r2(avail+cfg.bonus);lump+=cfg.bonus;}
    if(cfg.bonusBy&&cfg.bonusBy[dt]>0){avail=r2(avail+cfg.bonusBy[dt]);lump+=cfg.bonusBy[dt];}
    var extras=[];var extraTotal=0;
    function addExtra(k,amt){
      var ex=null;for(var z=0;z<extras.length;z++)if(extras[z].debtId===k)ex=extras[z];
      if(ex)ex.amount=r2(ex.amount+amt);else extras.push({key:'extra:'+k+'@'+paydays[i],debtId:k,name:D[k].name,amount:amt,date:paydays[i]});
      D[k].bal=r2(D[k].bal-amt);avail=r2(avail-amt);extraTotal=r2(extraTotal+amt);
    }
    if(cfg.strategy!=='min'){
      ids.forEach(function(k){
        var d=D[k];if(!d.promo||d.bal<=0.005||paydays[i]>=d.promo||avail<=0.005)return;
        var left=0;for(var q=i;q<paydays.length&&paydays[q]<d.promo;q++)left++;
        var need=r2(d.bal/Math.max(1,left));var mp=0;
        items.forEach(function(it){if(it.debtId===k)mp=r2(mp+it.amount);});
        var amt=r2(Math.min(Math.max(0,need-mp),avail,d.bal));
        if(amt>0.005)addExtra(k,amt);
      });
    }
    if(cfg.strategy!=='min'&&avail>0.005){
      var order=ids.filter(function(k){return D[k].bal>0.005;});
      order.sort(cfg.strategy==='snowball'?function(a,b){return D[a].bal-D[b].bal;}:function(a,b){var ra=(D[a].promo&&paydays[i]<D[a].promo)?D[a].apr:D[a].aprAfter,rb=(D[b].promo&&paydays[i]<D[b].promo)?D[b].apr:D[b].aprAfter;return (rb-ra)||(D[a].bal-D[b].bal);});
      for(var q=0;q<order.length;q++){
        var k2=order[q];if(avail<=0.005)break;
        var amt2=r2(Math.min(avail,D[k2].bal));if(amt2>0.005)addExtra(k2,amt2);
      }
    }
    ids.forEach(function(k){if(D[k].bal<=0.005&&!paidOff[k]){paidOff[k]=paydays[i];D[k].bal=0;}});
    series.push({date:paydays[i],total:total()});

  }
  var free=ids.length&&ids.every(function(k){return paidOff[k];})?ids.map(function(k){return paidOff[k];}).sort().pop():null;
  return {rows:rows,paidOff:paidOff,interest:interest,series:series,debtFree:free,paydays:paydays};
}

function viewByPaycheck(rows){

function viewByDate(rows){

function niceStep(x){var p=Math.pow(10,Math.floor(Math.log(x)/Math.LN10));var f=x/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p;}
function chart(A){
  var W=640,H=250,L=50,R=14,T=12,B=28;
  var t0=A.min.series[0].total;if(!(t0>0))return '';
  var asOf=S.settings.asOf;
  function mo(s){return daysBetween(asOf,s)/30.4375;}
  var xmax=0;A.min.series.forEach(function(p){if(p.total>0.005)xmax=Math.max(xmax,mo(p.date));});
  xmax=Math.min(72,Math.max(12,Math.ceil(xmax/12)*12));
  function X(m){return L+(W-L-R)*(m/xmax);}
  function Y(v){return T+(H-T-B)*(1-v/t0);}
  function line(ser,cls){
    var pts=ser.filter(function(p){return mo(p.date)<=xmax;}).map(function(p){return X(mo(p.date)).toFixed(1)+','+Y(p.total).toFixed(1);});
    return '<polyline class="'+cls+'" points="'+pts.join(' ')+'"/>';
  }
  var g='',step=niceStep(t0/4);
  for(var v=0;v<=t0+1;v+=step){g+='<line class="g" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'"/><text x="'+(L-6)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end">'+(v===0?'$0':'$'+Math.round(v/1000)+'k')+'</text>';}
  var xs=xmax>36?12:6;
  for(var m=0;m<=xmax;m+=xs){g+='<text x="'+X(m).toFixed(1)+'" y="'+(H-8)+'" text-anchor="'+(m===0?'start':'middle')+'">'+(m===0?'Now':(m%12===0?(m/12)+' yr':m+' mo'))+'</text>';}
  return '<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Total debt over time under each plan">'+g+line(A.min.series,'l-min')+line(A.plan.series,'l-plan')+line(A.bon.series,'l-bonus')+'</svg>';

function parseStub(text){

function readStubFile(file){

  fr.onload=function(){
    loadPdfJs().then(function(lib){return lib.getDocument({data:new Uint8Array(fr.result)}).promise;}).then(function(doc){
      var jobs=[];for(var i=1;i<=doc.numPages;i++)jobs.push(doc.getPage(i).then(function(pg){return pg.getTextContent();}).then(function(c){return c.items.map(function(x){return x.str;}).join(' ');}));
      return Promise.all(jobs);
    }).then(function(parts){
      var o=parseStub(parts.join(' '));
      if(!(o.net>0)){S.chk.msg='I could not find the net pay in that file. Type it in below.';render();return;}
      var ds=checkDates();var d=(o.date&&ds.indexOf(o.date)>-1)?o.date:S.chk.date;

      S.chk.date=d;S.chk.msg=msg;
      var upd={};upd[d]=entry;wUpd('checks',{map:upd});render();
    }).catch(function(){S.chk.msg='Could not read the PDF here (it needs internet the first time). Type the net pay in below.';render();});
  };

function applyCheck(){

  r.items.forEach(function(it){if(it.debtId){var x=find(it.debtId);if(x)x.balance=r2(Math.max(0,x.balance-it.amount));}});
  r.extras.forEach(function(e){var x=find(e.debtId);if(x)x.balance=r2(Math.max(0,x.balance-e.amount));});
  debts.forEach(function(x){x.balance=x.balance>0.005?r2(x.balance*(1+effApr(x,addDays(r.date,14))/2400)):0;});

  var log=clone((S.docs.log&&S.docs.log.items)||[]);
  log.push({date:r.date,net:r.income,bills:r.billsTotal,living:r.living,extra:r.extraTotal,left:r.left,at:TODAY});
  wSet('debts',{items:debts});wUpd('paid',{map:pm});wSet('log',{items:log});

function render(){
  var app=$('#app');
  VIEWS.forEach(function(t){var el=$('#t-'+t);if(el)el.setAttribute('aria-selected',String(S.view===t));});
  if(S.view==='data'){$('#sub').textContent='';app.innerHTML=viewData();$('#layer').innerHTML='';return;}
  if(!hasData()){$('#sub').textContent='';app.innerHTML=welcomeHTML();return;}
  var A=scenarios();
  $('#sub').textContent=S.view==='pay'?'Paid '+Object.keys(S.paid).filter(function(k){return S.paid[k];}).length+' so far':'';
  var html='';
  if(S.view==='check')html=viewCheck(A);else if(S.view==='debts')html=viewDebts(A);else if(S.view==='bills')html=viewBills();else html=viewPay(A);
  app.innerHTML=html;
  $('#layer').innerHTML=S.editing?sheetHTML(S.editing):'';
  S.pending=false;S.mute=true;setTimeout(function(){S.mute=false;},80);
}

/* ---------- events ---------- */
function setView(v){S.view=v;if(location.hash!=='#'+v)location.hash=v;render();window.scrollTo(0,0);}
document.querySelector('.tabs').addEventListener('click',function(e){var b=e.target.closest('[data-tab]');if(b)setView(b.dataset.tab);});
window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(VIEWS.indexOf(h)>-1&&h!==S.view){S.view=h;render();}});
$('#app').addEventListener('toggle',function(e){
  var d=e.target;if(S.mute||!d.matches||!d.matches('details.pc'))return;
  var k=d.dataset.date;
  if(d.open){S.userOpen.add(k);S.userClosed.delete(k);}else{S.userOpen.delete(k);S.userClosed.add(k);}
},true);
$('#app').addEventListener('focusout',function(){if(S.pending)setTimeout(function(){var a=document.activeElement;if(!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)))render();},0);});
$('#app').addEventListener('click',function(e){
  var t=e.target;
  var sub=t.closest('[data-sub]');if(sub){S.sub=sub.dataset.sub;render();return;}
  var st=t.closest('[data-strategy]');if(st){setSetting('strategy',st.dataset.strategy);return;}
  var ed=t.closest('[data-edit]');if(ed){var b=S.bills.filter(function(x){return x.id===ed.dataset.edit;})[0];if(b){S.editing={isNew:false,bill:clone(b)};render();}return;}
  if(t.closest('[data-act="add"]')){S.editing={isNew:true,bill:{id:'b'+Date.now().toString(36),name:'',amount:0,freq:'monthly',dueDay:1,group:'Other',autopay:false,active:true,note:''}};render();}
});
$('#app').addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.paid){
    var key=t.dataset.paid,val=t.checked?TODAY:null;
    var card=t.closest('details.pc');if(card)S.userOpen.add(card.dataset.date);
    S.paid=Object.assign({},S.paid);S.paid[key]=val;render();
    wUpd('paid',{map:(function(){var o={};o[key]=val;return o;})()});return;
  }
  if(t.dataset.set){
    var f=t.dataset.set;var v=f==='asOf'?(t.value||S.settings.asOf):num(t.value,S.settings[f]);
    if(f==='buffer')v=Math.max(0,Math.min(10,Math.round(v)));
    setSetting(f,v);return;
  }
  if(t.dataset.toggle){setSetting(t.dataset.toggle,t.checked);return;}
  var card2=t.closest('[data-debt]');
  if(card2&&t.dataset.f){
    var items=clone(S.debts);var d=items.filter(function(x){return x.id===card2.dataset.debt;})[0];if(!d)return;
    var f2=t.dataset.f;
    if(f2==='autopay')d.autopay=t.checked;else{d[f2]=num(t.value,d[f2]);if(f2==='apr')d.aprKnown=true;if(f2==='dueDay')d.dueDay=Math.max(1,Math.min(31,Math.round(d.dueDay)));}
    S.docs.debts={items:items};recompute();render();wSet('debts',{items:items});
  }
});
function setSetting(f,v){
  var s=clone(S.settings);s[f]=v;S.docs.settings=s;recompute();render();
  var o={};o[f]=v;wUpd('settings',o);
}
$('#layer').addEventListener('change',function(e){
  if(e.target.id==='f-freq'){var once=e.target.value==='once';$('#w-day').hidden=once;$('#w-date').hidden=!once;}
});
$('#layer').addEventListener('click',function(e){
  var a=e.target.closest('[data-act]');if(!a)return;
  if(a.dataset.act==='close'){S.editing=null;render();}
  if(a.dataset.act==='del'){
    var items=S.bills.filter(function(b){return b.id!==S.editing.bill.id;});
    S.editing=null;S.docs.bills={items:items};recompute();render();wSet('bills',{items:items});
  }
});
$('#layer').addEventListener('submit',function(e){
  e.preventDefault();
  var name=$('#f-name').value.trim();var amount=num($('#f-amount').value,NaN);
  if(!name){toast('Give the bill a name.');return;}
  if(!(amount>=0)){toast('Enter an amount.');return;}
  var b=S.editing.bill;b.name=name;b.amount=Math.round(amount*100)/100;b.freq=$('#f-freq').value;b.group=$('#f-group').value;
  b.note=$('#f-note').value.trim();b.autopay=$('#f-auto').checked;b.active=$('#f-active').checked;
  if(b.freq==='once'){
    var dd=$('#f-date').value;if(!dd){toast('Pick a due date.');return;}
    b.dueDate=dd;delete b.dueDay;delete b.start;
  }else{
    var day=Math.round(num($('#f-day').value,NaN));if(!(day>=1&&day<=31)){toast('Due day must be 1 to 31.');return;}
    b.dueDay=day;delete b.dueDate;
    if(!b.start){
      var a=S.settings.asOf,y=+a.slice(0,4),m=+a.slice(5,7),ld=new Date(Date.UTC(y,m,0)).getUTCDate();
      var cand=y+'-'+pad(m)+'-'+pad(Math.min(day,ld));
      if(cand<a){m++;if(m>12){m=1;y++;}}
      b.start=y+'-'+pad(m);
    }
  }
  var items=clone(S.bills);var idx=items.findIndex(function(x){return x.id===b.id;});
  if(idx>-1)items[idx]=b;else items.push(b);
  S.editing=null;S.docs.bills={items:items};recompute();render();wSet('bills',{items:items});
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.editing){S.editing=null;render();}});

var h0=location.hash.slice(1);if(VIEWS.indexOf(h0)>-1)S.view=h0;
boot();
})();
</script>
</body>
</html>
